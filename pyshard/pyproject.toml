[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyshard-p9"
version = "0.1.0"
description = "Python-centric reverse-engineering, SRP sharding, and synthesis engine with integrated agent framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "PyShard-P9"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = ["ast", "sharding", "synthesis", "reverse-engineering", "srp", "agent", "llm"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]
web = ["fastapi", "uvicorn[standard]", "pydantic"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pyshard*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pyshard*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
